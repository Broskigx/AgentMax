# Ruff configuration for the AgentMax desktop agent (core/, scripts/, tests/, sdk/).
# The backend service keeps its own settings in backend/pyproject.toml.
line-length = 100
target-version = "py311"

# Nested clones and legacy artifact dumps are not part of this codebase; some
# contain permission-locked dirs that break directory traversal on Windows.
extend-exclude = [
    "AgentMax",
    "AgentMax_legacy_artifacts_20260606",
    "ffg",
    "lora_adapters",
    "terminals",
    "node_modules",
]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line length is owned by the formatter
    "B008",   # FastAPI Depends()/Body() defaults are idiomatic
    "C901",   # function complexity is reviewed manually
    "E402",   # entry-point scripts insert the repo root into sys.path before importing
    "UP042",  # (str, Enum) is intentional and behaviourally stable
    "UP046",  # PEP 695 generic syntax not adopted yet
]
