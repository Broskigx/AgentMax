[pytest]
testpaths = tests
addopts = -ra -q --strict-markers
asyncio_mode = auto
norecursedirs =
    .git
    .venv
    node_modules
    ui/node_modules
    ui/src-tauri/target
    target
    dist
    diagnostics
    logs
    runtime_logs
    BetaAgentMax
    AgentPilot-Train-Qwen3-32B
    models
    datasets
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security tests
