[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AgentMax-backend"
version = "1.0.0"
description = "AgentMax License & Auth Backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "AgentMax Team", email = "dev@AgentMax.com" },
]
keywords = ["license", "authentication", "saas", "api", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other :: Proprietary",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis[hiredis]>=5.0",
  "pydantic-settings>=2.3",
  "cryptography>=42.0",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-ulid>=2.2",
  "orjson>=3.10",
  "tenacity>=8.3",
  "aiohttp>=3.9",
  "aiosqlite>=0.19",
  "pillow>=10.0",
  "python-multipart>=0.0.6",
  "msgpack>=1.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "httpx>=0.27",
  "ruff>=0.1",
  "mypy>=1.7",
]
prod = [
  "uvicorn[standard]>=0.30",
  "uvloop>=0.19; platform_system != 'Windows'",
  "httptools>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # layout is owned by `ruff format`
    "B008",   # FastAPI Depends()/Body() in argument defaults is the idiomatic pattern
    "C901",   # function complexity is reviewed manually
    "E402",   # Alembic env.py imports-after-config + intentional lazy imports
    "UP042",  # (str, Enum) is intentional and behaviourally stable
    "UP046",  # PEP 695 generic syntax not adopted yet
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "security: marks tests as security tests",
]

[tool.coverage.run]
source = ["backend"]
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
